events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10m;
    server_tokens off;

    # Den publika KB-portalen är olistad: token-URL:en får inte indexeras eller
    # lagras i delade cachelager. Övriga SPA-rutter måste omvalideras så att
    # cachad HTML inte pekar på gamla JavaScript-filer efter en driftsättning.
    # $request_uri bevarar den ursprungliga portaladressen även när try_files
    # internt skriver om SPA-navigationen till /index.html.
    map $request_uri $kb_portal_robots {
        default "";
        ~^/kb/public/ "noindex, nofollow, noarchive";
    }

    # Cache-Control sätts på ETT ställe (server-nivå) så att ingen location behöver
    # egna add_header — en location med add_header tappar ALLA server-nivåns headers
    # (CSP, HSTS m.fl.). Statiska filer och service worker avgörs på slutlig $uri och
    # bara för lyckade svar, så ett 404 aldrig cachas i ett år. stale-entry.js
    # undantas medvetet: den serveras under en annan (saknad) bundle-URL och får
    # aldrig fastna som immutable.
    map "$status $uri" $static_cache_control {
        default "no-cache";
        "~^(?:200|206|304) /sw\.js$" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        "~*^(?:200|206|304) /(?!stale-entry\.js$).*\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" "public, immutable";
    }

    # /api/: tom sträng = ingen header, Express sätter själv sin Cache-Control.
    map $request_uri $cache_control {
        default $static_cache_control;
        ~^/api/ "";
        ~^/kb/public/ "private, no-store";
    }

    # Standardmönstret för proxy mot upstream: Connection: upgrade bara när klienten
    # faktiskt ber om en uppgradering, annars close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Access-loggen får aldrig innehålla engångs-/delningstokens: de ger åtkomst till
    # lösenordsåterställning, delade ärenden och den olistade KB-portalen. Token-
    # segmentet ersätts med <redacted>, även när adressen står i Referer-headern.
    # OIDC-callbackens query (code/state) maskas på samma sätt.
    map $request_uri $loggable_uri {
        default $request_uri;
        ~^(?<uri_prefix>/(?:api/shares/public/file|api/shares/public|api/kb/portal|api/kb/public|reset-password|shared|kb/public)/)[^/?]+(?<uri_suffix>.*)$ "${uri_prefix}<redacted>${uri_suffix}";
        ~^(?<oidc_path>/api/auth/oidc/callback)\? "${oidc_path}?<redacted>";
    }

    map $http_referer $loggable_referer {
        default $http_referer;
        ~^(?<ref_prefix>https?://[^/]+/(?:reset-password|shared|kb/public)/)[^/?]+(?<ref_suffix>.*)$ "${ref_prefix}<redacted>${ref_suffix}";
    }

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $loggable_uri $server_protocol" $status $body_bytes_sent '
                        '"$loggable_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log redacted;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml text/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Riktig klient-IP bakom en TLS-terminerande proxy. Utan detta är $remote_addr
        # proxyns adress för ALLA användare → delad rate-limit-bucket och samma IP i
        # audit_log. X-Forwarded-For litas bara på när anslutningen kommer från de
        # privata näten nedan — ALLA RFC1918-nät, eftersom koden inte kan veta proxyns IP.
        # MÅSTE smalnas av till front-proxyns /32 (t.ex. `set_real_ip_from 192.168.1.10/32;`)
        # INNAN go-live, och port 8082 ska bindas till det proxy-vända gränssnittet i
        # compose/Portainer (inte alla gränssnitt) — annars kan vem som helst på LAN:et
        # förfalska sin IP med en egen X-Forwarded-For och kringgå rate limits. Verifiera i
        # docs/OPERATIONS.md (audit_log.ip_address).
        # Prod (2026-10-09): Nginx Proxy Manager ligger på ett annat Docker-nät och når
        # frontend via den publicerade porten 8082 — anslutningen kommer då från
        # bryggans gateway 172.31.0.1 (nätet it-ticket-system_ticketing). Bara den
        # adressen är betrodd; LAN-klienter som går direkt mot :8082 får sin egen IP.
        set_real_ip_from 172.31.0.1/32;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Säkerhetsheaders för SPA-skalet — Helmet skyddar bara /api/*, inte den
        # nginx-serverade HTML/JS/CSS:en. `always` gör att de även sätts på fel-svar.
        # VIKTIGT: ingen location nedan får ha egna add_header — då ärvs inte dessa
        # (Cache-Control styrs därför av $cache_control-mappen ovan).
        # CSP är medvetet tillåtande nog att inte krascha appen: index.html har ETT
        # inline-script (script-src 'unsafe-inline'), Google Fonts laddas via CSS-@import,
        # och attachments/avatarer använder blob:/data:-bilder. frame-ancestors
        # tillåter endast samma origin och Prefabnavets appskal (prod + dev) att
        # bädda in SPA:n — Navet bäddar in /submit-ticket i sin Felanmälan-vy.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self' https://navet.prefabmastarna.se https://navet-dev.prefabmastarna.se; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Robots-Tag $kb_portal_robots always;
        add_header Cache-Control $cache_control always;

        # Backup restore endpoint — needs higher upload limit (full DB + uploads ZIP).
        # ^~ ensures this prefix match wins over the broader /api/ block below.
        location ^~ /api/backup/restore {
            resolver 127.0.0.11 valid=30s;
            set $backend http://it-ticketing-backend:3001;
            client_max_body_size 500m;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            # Helmets CSP är avsedd för API-svar som aldrig renderas; server-blockets
            # SPA-CSP läggs ändå på av nginx, så dölj upstreamens för att slippa dubbletter.
            proxy_hide_header Content-Security-Policy;
        }

        # Proxy API requests to backend
        # ^~ ensures this prefix match takes priority over regex location blocks below,
        # preventing e.g. /api/kb/images/photo.jpg from being caught by the static-files
        # regex and served (incorrectly) as a frontend asset.
        location ^~ /api/ {
            resolver 127.0.0.11 valid=30s;
            set $backend http://it-ticketing-backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # Fynd 7: Höj timeouts för GET /api/backup (live-ZIP-streaming kan ta >60s default).
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # Helmet sätter redan dessa; nginx lägger på samma headers på server-nivå,
            # så upstreamens kopior döljs för att undvika dubbletter. CSP och
            # X-Robots-Tag lämnas orörda (Express sätter egna på t.ex. KB-portalen).
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            # Helmets CSP är avsedd för API-svar som aldrig renderas; server-blockets
            # SPA-CSP läggs ändå på av nginx, så dölj upstreamens för att slippa dubbletter.
            proxy_hide_header Content-Security-Policy;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Service worker must never be cached - browser checks for SW updates via HTTP cache
        # (Cache-Control no-store via $cache_control-mappen).
        location = /sw.js {
            try_files $uri =404;
        }

        # Old cached HTML may request an entry bundle removed by deployment.
        # Recover only the entry point; never substitute arbitrary lazy chunks.
        location ~ ^/assets/index-[A-Za-z0-9_-]+\.js$ {
            try_files $uri /stale-entry.js;
        }

        location = /stale-entry.js {
            try_files $uri =404;
        }

        # Tomt block med flit: håller statiska filer utanför `location /` så att en
        # saknad fil ger 404 i stället för index.html. Cache-Control kommer från mappen.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        }
    }
}
