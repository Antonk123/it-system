services:
  backend:
    image: it-ticketing-backend:latest
    container_name: it-ticketing-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3002}:3001"
    volumes:
      - it-ticketing-data:/app/data
    environment:
      - NODE_ENV=production
      # Tidszon för schemalagda jobb (backup-tid m.fl.). Kräver tzdata i imagen
      # (se Dockerfile.server). Utan TZ körs allt i UTC.
      - TZ=${TZ:-Europe/Stockholm}
      # Serveras över HTTP på LAN → Secure-cookies tappas av webbläsaren.
      # Sätt COOKIE_SECURE=true om du kör bakom HTTPS. Se docker-compose.yml.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - DB_PATH=/app/data/database.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_BASE_URL=${APP_BASE_URL}
      - BRAND_NAME=${BRAND_NAME:-IT-Support}
      - AUTO_CLOSE_DAYS=${AUTO_CLOSE_DAYS:-30}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_MODEL_SMART=${AI_MODEL_SMART:-}
      - AI_MAX_SUMMARY_COMMENTS=${AI_MAX_SUMMARY_COMMENTS:-}
      - AI_MONTHLY_TOKEN_LIMIT=${AI_MONTHLY_TOKEN_LIMIT:-}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - IMAP_POLL_INTERVAL=${IMAP_POLL_INTERVAL:-60}
      - IMAP_AUTO_CREATE_CONTACT=${IMAP_AUTO_CREATE_CONTACT:-true}
      - IMAP_TENANT_ID=${IMAP_TENANT_ID:-}
      - IMAP_CLIENT_ID=${IMAP_CLIENT_ID:-}
      - IMAP_CLIENT_SECRET=${IMAP_CLIENT_SECRET:-}
      # SSO/OIDC. Tom sträng = SSO fail-closed avstängt (knappen döljs,
      # /api/auth/oidc/* svarar 503) — raderna måste ändå finnas, annars når
      # värdena aldrig containern och SSO blir tyst av. OIDC_ISSUER_URL måste
      # namnge EXAKT EN tenant; /common, /organizations och /consumers avvisas
      # av koden (deras issuer har platshållaren {tenantid} → iss-kontrollen
      # blir självrefererande och släpper in vilken Entra-tenant som helst).
      # Se docker-compose.yml för längre motivering.
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-}
      - OFFSITE_BACKUP_CMD=${OFFSITE_BACKUP_CMD:-}
      - OFFSITE_BACKUP_REQUIRED=${OFFSITE_BACKUP_REQUIRED:-false}
      - PUSH_AGING_DAYS=${PUSH_AGING_DAYS:-7}
      - SHUTDOWN_TIMEOUT_MS=${SHUTDOWN_TIMEOUT_MS:-10000}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ticketing

  frontend:
    image: it-ticketing-frontend:latest
    container_name: it-ticketing-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ticketing

networks:
  ticketing:
    driver: bridge

volumes:
  it-ticketing-data:
    driver: local
