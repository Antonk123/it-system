services:
  backend:
    image: it-ticketing-backend:latest
    container_name: it-ticketing-backend
    restart: unless-stopped
    # Endast loopback: nginx i frontend-containern når backend via docker-nätverket
    # (it-ticketing-backend:3001) och behöver inte den publicerade porten. Appen kör med
    # `trust proxy 1` och litar därför på X-Forwarded-For — en port öppen mot LAN låter
    # vem som helst förfalska sin IP och kringgå rate limits/audit_log. Se docs/OPERATIONS.md:
    # Portainer-stacken är en separat kopia och måste ändras för hand.
    ports:
      - "127.0.0.1:3002:3001"
    # Dockers standard-grace är 10 s; appen väntar upp till 15 s på pågående backup/requests
    # (SHUTDOWN_TIMEOUT_MS), annars SIGKILL mitt i en backup.
    stop_grace_period: 20s
    volumes:
      - it-ticketing-data:/app/data
      # Separat volym för backuper — OBS: skapa volymen manuellt i Portainer GUI
      # innan deploy (Volumes → Add volume → it-ticketing-backups, driver: local).
      - it-ticketing-backups:/app/data/backups
    environment:
      - NODE_ENV=production
      # Tidszon för alla schemalagda jobb (backup-tid, auto-close, push-aging,
      # recurring) och lokaltidsbaserad logik. Kräver tzdata i imagen (se
      # Dockerfile.server). Sätt till din zon — utan den körs allt i UTC.
      - TZ=${TZ:-Europe/Stockholm}
      # Frontend serveras över HTTP på LAN (8082:80). Webbläsare lagrar INTE
      # Secure-cookies på icke-HTTPS-origins → CSRF-/refresh-cookies tappas och
      # ärenden går inte att spara (särskilt i installerad PWA på telefon).
      # PRODUKTION BEHÖVER COOKIE_SECURE=true i Portainer-stacken (prod körs bakom
      # TLS på ticket.prefabmastarna.se). Defaulten false gäller bara ren HTTP-LAN och
      # ger annars cookies utan Secure-flagga; servern loggar en varning vid start.
      # Se docs/OPERATIONS.md.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - DB_PATH=/app/data/database.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - BRAND_NAME=${BRAND_NAME:-IT-Support}
      - AUTO_CLOSE_DAYS=${AUTO_CLOSE_DAYS:-30}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - IMAP_POLL_INTERVAL=${IMAP_POLL_INTERVAL:-60}
      - IMAP_AUTO_CREATE_CONTACT=${IMAP_AUTO_CREATE_CONTACT:-true}
      - IMAP_TENANT_ID=${IMAP_TENANT_ID:-}
      - IMAP_CLIENT_ID=${IMAP_CLIENT_ID:-}
      - IMAP_CLIENT_SECRET=${IMAP_CLIENT_SECRET:-}
      # SSO/OIDC. Tom sträng = SSO fail-closed avstängt (knappen döljs och
      # /api/auth/oidc/* svarar 503) — men raderna måste ändå stå här, annars
      # når värdena aldrig containern och SSO blir tyst av trots "lyckad" deploy.
      # OIDC_ISSUER_URL måste namnge EXAKT EN tenant, t.ex.
      # https://login.microsoftonline.com/<TENANT_ID>/v2.0. Multitenant-
      # endpointsen (/common, /organizations, /consumers) avvisas av koden:
      # deras issuer innehåller platshållaren {tenantid}, vilket gör iss-
      # kontrollen självrefererande så att vilken Entra-tenant som helst
      # skulle validera.
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      # Tom OFFSITE_BACKUP_CMD = backuper ligger bara på samma host som databasen.
      # Sätt OFFSITE_BACKUP_CMD, OFFSITE_BACKUP_REQUIRED=true och montera rclone-config
      # i Portainer-stacken — exakta rader finns i docs/OPERATIONS.md (Off-site-backup).
      - OFFSITE_BACKUP_CMD=${OFFSITE_BACKUP_CMD:-}
      - OFFSITE_BACKUP_REQUIRED=${OFFSITE_BACKUP_REQUIRED:-false}
      - PUSH_AGING_DAYS=${PUSH_AGING_DAYS:-7}
      - SHUTDOWN_TIMEOUT_MS=${SHUTDOWN_TIMEOUT_MS:-15000}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ticketing

  frontend:
    image: it-ticketing-frontend:latest
    container_name: it-ticketing-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ticketing

networks:
  ticketing:
    driver: bridge

volumes:
  it-ticketing-data:
    external: true
  # Dedikerad volym för backuper — separerad från live-DB:n.
  # Skapa manuellt i Portainer GUI innan deploy: Volumes → Add volume → it-ticketing-backups.
  it-ticketing-backups:
    external: true
