      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The template's fields in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TemplateField" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /templates/{templateId}/fields/{fieldId}:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
