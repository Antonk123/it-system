    put:
      operationId: templateFieldsUpdate
      tags: [Template fields]
      summary: Update a template's dynamic field (admin)
      description: Admin only. Partial update (each omitted field keeps its current value).
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateFieldInput" }
      responses:
        "200":
          description: Updated field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateField" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: templateFieldsDelete
      tags: [Template fields]
      summary: Delete a template's dynamic field (admin)
      description: Admin only.
      security:
        - bearerAuth: []
          csrfToken: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tags:
    get:
      operationId: tagsList
      tags: [Tags]
      summary: List knowledge-base tags
      description: >
        Returns all knowledge-base tags (id, name, color, created_at), ordered by name
        ascending. "Tags" here means ticket labels, unrelated to OpenAPI's own
        `tags:` grouping concept. Available to any authenticated user.
      responses:
        "200":
          description: List of knowledge-base tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagsTag" }
    post:
      operationId: tagsCreate
      tags: [Tags]
      summary: Create a knowledge-base tag
      description: >
        Creates a new knowledge-base tag. Admin-only. `name` is required (trimmed,
        non-empty) and must be unique; `color` defaults to `#3b82f6` when
        omitted.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagsInput" }
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagsTag" }
        "400":
          description: Missing/empty `name`, or a tag with that name already exists
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Forbidden" }

  /tags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: tagsUpdate
      tags: [Tags]
      summary: Update a knowledge-base tag
