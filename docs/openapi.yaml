openapi: 3.0.3
info:
  title: IT-Ticket API
  version: 1.1.0
  description: >
    REST-API för IT-Ticket — ett ärendehanteringssystem för intern IT-support på Prefabmästarna.


    **Leverans:** rullande från `main` (en instans per deployment).
    Versionen ovan spårar API-kontraktet, inte appens git-tagg.


    ## API coverage

    This spec documents the full API surface: 160 operations
    across every route file — health/CSRF, auth, tickets, categories,
    contacts, companies, kb, public, users, API keys,
    settings, comments, attachments, shares, links, checklists, checklist
    templates, template fields, tags,
    reports, backup, push notifications, webhooks, and inbound email.


    **Prose reference:** `docs/API.md` — generated from the actual Express
    routers in `server/src/routes/` and kept up to date on route changes. Use
    it as a narrative cross-check alongside this machine-readable spec.


    ## Autentisering

    Två sätt att autentisera, båda via `Authorization`-headern:

    - **Session (JWT):** `Authorization: Bearer <jwt>`. Access-token gäller 15 min;
      en HttpOnly refresh-cookie (path `/api/auth`) förnyar den via
      `POST /api/auth/refresh`. **Muterande anrop (POST/PUT/PATCH/DELETE) kräver
      även CSRF-token** i `x-csrf-token` (hämtas från `GET /api/csrf-token`).
    - **API-nyckel:** `Authorization: Bearer itk_live_...`. Nycklar har scope
      `read`, `read,write` eller — för administrativa endpoints — även `admin`.
      En nyckel utan `admin` får **403** på admin-skyddade endpoints *även om
      nyckelns ägare är administratör*: nyckeln är credentialen och dess scope
      kan bara inskränka åtkomsten, aldrig utöka den. Endast ett anrop som
      själv har `admin`-scope (eller en inloggad admin-session) får skapa en
      nyckel med `admin`. API-nyckel-anrop är **undantagna från CSRF**.


    ## Behörighet på ärenden

    Alla inloggade användare får **läsa** alla ärenden och deras underresurser
    (kommentarer, bilagor, checklistor, länkar, delningar, påminnelser).
    **Skriva** får admin, ärendets tilldelade eller skapare, samt vem som helst på
    ett **otilldelat** ärende (self-service-plock). Övriga får `403`. Se
    `docs/adr/0001-unified-ticket-access-policy.md`.

    ## Lösenordspolicy

    Minst 12 tecken och högst 72 byte; minst 3 av 4 teckenklasser (gemen, versal,
    siffra, övrigt) eller minst 16 tecken. Gäller `change-password`,
    `reset-password` och admin-skapade konton. Konton som en admin skapar har
    `mustChangePassword = true` tills användaren byter lösenord.

    ## Webhooks (utgående)

    Se `POST /webhooks` för leveransformat och signaturverifiering. **Brytande
    ändring:** `X-Webhook-Signature` är nu `hex(HMAC-SHA256(secret,
    timestamp + "." + id + "." + rawBody))` med `X-Webhook-Timestamp` och
    `X-Webhook-Id`; den gamla signaturen över enbart body verifierar inte längre.

    ## Fel

    Fel returneras som `{ "error": "..." }` med relevant HTTP-status.
  license:
    name: Se LICENSE i repot
    url: https://github.com/Antonk123/it-system
  contact:
    name: IT-Ticket
    url: https://github.com/Antonk123/it-system

servers:
  - url: https://helpdesk.example.com/api
    description: Your own instance's API base URL (placeholder)
  - url: http://localhost:3002/api
    description: Lokal (docker-compose.local)

tags:
  - name: Auth
    description: Inloggning, tokens, lösenord
  - name: System
    description: Hälsa och CSRF
  - name: Tickets
    description: Ärenden
  - name: Categories
    description: Ärendekategorier
  - name: Contacts
    description: Kontakter/beställare
  - name: Companies
    description: Företag/kunder
  - name: Knowledge base
    description: Kunskapsbas-artiklar
  - name: Public
    description: Oautentiserad portal (publika ärenden)
  - name: Comments
    description: Comments on tickets
  - name: Attachments
    description: File attachments on tickets
  - name: Checklists
    description: Per-ticket checklist items
  - name: Links
    description: Relationships between tickets
  - name: Shares
    description: Public, unauthenticated share links for tickets
  - name: Checklist templates
    description: Reusable checklist item sets applicable to tickets
  - name: Templates
    description: Reusable ticket blueprints, including dynamic form templates
  - name: Template fields
    description: Custom form fields belonging to a dynamic template
  - name: Tags
    description: Knowledge-base labels
  - name: Users
    description: System user accounts (admin)
  - name: API keys
    description: Personal API keys for programmatic access
  - name: Settings
    description: System-wide configuration
  - name: Reports
    description: Aggregate ticket, time, and requester analytics
  - name: Backup
    description: Full database/uploads backup and restore (admin)
  - name: Push notifications
    description: Web Push subscription management
  - name: Webhooks
    description: Outgoing event webhooks (admin)
  - name: Inbound email
    description: Mail-to-ticket (IMAP) ingestion status

# Default: de flesta endpoints accepterar antingen session-JWT eller API-nyckel.
# Publika endpoints sätter `security: []`, muterande lägger till csrfToken för
# sessionsgrenen (se beforehand: (bearerAuth AND csrfToken) OR apiKeyAuth).
security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Hälsokontroll
      security: []
      responses:
        "200":
          description: Tjänsten är uppe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
        "503":
          description: Databasfel
          $ref: "#/components/responses/Error"

  /csrf-token:
    get:
      tags: [System]
      summary: Hämta CSRF-token
      description: Returnerar token som ska skickas i `x-csrf-token` på muterande sessions-anrop.
      security: []
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: Logga in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Inloggad — access-token + refresh-cookie sätts
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  accessToken: { type: string }
                  token: { type: string, description: Alias för accessToken (bakåtkompat) }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: >
            För många misslyckade försök (per IP och per konto). `Retry-After`
            anger sekunder kvar; kroppen innehåller `retryAfter`.
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Förnya access-token
      description: >
        Läser refresh-token enbart från den HttpOnly-cookie som `login` satte
        (ingen token i body). Token roteras vid varje anrop (ny cookie). En
        redan använd token som återanvänds räknas som stöld och återkallar hela
        token-familjen. Refresh-token lagras hashad i databasen.
      security: []
      responses:
        "200":
          description: Ny access-token (ny refresh-cookie sätts)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  token: { type: string }
        "400":
          description: Cookien saknas
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logga ut
      description: >
        Kräver **ingen** access-token (en utgången token ska inte hindra
        utloggning); refresh-cookien identifierar sessionen. Cookien rensas
        alltid och motsvarande refresh-token återkallas.
      security: []
      responses:
        "204":
          description: Utloggad

  /auth/me:
    get:
      tags: [Auth]
      summary: Aktuell användare
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Användaren
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          mustChangePassword: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Byt lösenord
      description: >
        Nytt lösenord måste följa lösenordspolicyn (minst 12 tecken, se
        API-beskrivningen). Alla andra sessioner och utestående access-tokens
        återkallas; den anropande sessionen får en ny refresh-cookie och en ny
        access-token i svaret. Nollställer `mustChangePassword`.
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        "200":
          description: Lösenordet bytt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  accessToken: { type: string, description: Ny access-token för den aktuella sessionen. }
                  token: { type: string, description: Alias för accessToken. }
        "400": { $ref: "#/components/responses/Error" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Begär lösenordsåterställning
      description: Svarar alltid generiskt (anti-enumeration), oavsett om e-posten finns.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Message" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Återställ lösenord med token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }

  /auth/oidc/enabled:
    get:
      operationId: authOidcEnabled
      tags: [Auth]
      summary: Är SSO (OIDC) påslaget?
      description: >
        Publik — SPA:n frågar innan inloggningsvyn ritas om SSO-knappen ska visas.
      security: []
      responses:
        "200":
          description: SSO-status och knapptext
          content:
            application/json:
              schema:
                type: object
                required: [enabled, label, provider]
                properties:
                  enabled:
                    type: boolean
                    description: >
                      Sant först när samtliga OIDC_*-värden är satta och den
                      konfigurerade issuer-URL:en godkänns statiskt (rätt
                      protokoll, inte en känd multitenant-endpoint eller
                      v1.0-värd). Det tenant-lås som jämför den UPPTÄCKTA
                      issuerns tenant-GUID mot den konfigurerade gäller bara
                      när `OIDC_ISSUER_URL` skrevs i GUID-form — skrevs den i
                      domännamnsform (t.ex. `.../foretag.se/v2.0`, som
                      `.env.example` rekommenderar som lika giltig) hoppar den
                      jämförelsen medvetet över, eftersom Entra alltid svarar
                      med GUID-form i issuern och det inte finns något sätt att
                      slå upp domän→GUID utan ett extra nätverksanrop. Det
                      grundläggande låset — att id_tokenets `tid` måste matcha
                      den tenant som den upptäckta issuern faktiskt namnger —
                      gäller ändå, oavsett vilken form som konfigurerades.
                      `enabled` blir också falskt när boot-proben fått svar
                      från discovery men underkänt den upptäckta issuern
                      (platshållarmall eller Microsofts konsument-tenant) —
                      SSO stängs då AV även om env-värdena fortfarande är
                      giltiga, tills konfigurationen rättas och processen
                      startas om.
                  label: { type: string, nullable: true, description: Knapptext från OIDC_BUTTON_LABEL — null när SSO är av }
                  provider:
                    type: string
                    enum: [microsoft]
                    nullable: true
                    description: >
                      Härledd ur den KONFIGURERADE issuerns värdnamn (aldrig ur
                      `OIDC_BUTTON_LABEL`, som är fri operatörstext) —
                      `"microsoft"` när värdnamnet ligger i Entras värdfamilj,
                      annars `null`. Alltid `null` när `enabled` är `false`.

  /auth/oidc/login:
    get:
      operationId: authOidcLogin
      tags: [Auth]
      summary: Starta SSO-inloggning
      description: >
        Browser-navigation (inte fetch/XHR): svarar 302 till IdP:ns
        authorization-endpoint med Authorization Code + PKCE (S256).
        `state`, `nonce` och `code_verifier` läggs i en kortlivad HttpOnly-cookie
        (`oidcTx`, SameSite=Lax, path `/api/auth/oidc`, 10 min) som callbacken
        verifierar mot. Rate limit: 20 anrop/15 min/IP.
      security: []
      responses:
        "302":
          description: Redirect till IdP:ns authorization-endpoint
          headers:
            Location:
              description: IdP:ns authorization-URL
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Transaktions-cookien `oidcTx` (HttpOnly)
              schema: { type: string }
        "503":
          description: >
            SSO är av — antingen okonfigurerat eller avvisat av
            single-tenant-kontrollen (multitenant-endpoint, v1.0-issuer eller
            icke-https; se `.env.example`) — eller så kunde IdP:ns discovery
            inte nås.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oidc/callback:
    get:
      operationId: authOidcCallback
      tags: [Auth]
      summary: Ta emot IdP:ns svar och logga in
      description: >
        Anropas av webbläsaren via IdP:ns redirect — inte av SPA:n. Kräver
        `oidcTx`-cookien från `/auth/oidc/login`: `state`, `nonce` och PKCE
        verifieras mot den, liksom id_tokenets `aud`, `exp`/`nbf` och `iss`.
        JWS-signaturen valideras **inte** separat mot IdP:ns JWKS — det skulle
        kräva `enableNonRepudiationChecks()` på discovery-configen, vilket koden
        aldrig anropar. Förtroendet vilar i stället på att tokenet hämtas direkt
        från IdP:ns token-endpoint över TLS med confidential-client-
        autentisering, vilket OIDC Core 3.1.3.7 p. 6 uttryckligen tillåter som
        alternativ till signaturverifiering i det här flödet. `iss` (och på
        Entra `tid`) kontrolleras dessutom om av vår egen kod.


        Autentiserar **endast konton som redan finns** i IT-Ticket — ingen
        JIT-provisionering, och en okänd identitet nekas i stället för att
        skapas. Endast den enda konfigurerade tenantens tokens accepteras.


        Identiteten matchas i första hand på paret (`oidc_sub`, `oidc_iss`).
        Ger det ingen träff härleds **exakt en** adress ur claims, och vilken
        claim som ens prövas beror på om den upptäckta issuern är Entra eller
        en generisk OIDC-provider. På Entra, i förtroendeordning:
        `preferred_username` om den innehåller `@` (för en tenant-medlem
        normalt UPN:en, vars suffix Entra kräver ska vara en verifierad domän
        — men `preferred_username` är Microsofts egen dokumenterat ostabila
        claim, så förtroendet gäller bara här, på Entra), annars `email` men
        bara om den är positivt verifierad (`xms_edov: true` eller
        `email_verified: true`), annars avslag. På en generisk OIDC-issuer
        prövas ENDAST `email` med `email_verified: true` —
        `preferred_username` konsulteras aldrig där, eftersom Entras
        UPN-domängaranti inte gäller för en godtycklig IdP. **Ingen fallback i
        något fall:** matchar den valda adressen inget konto blir svaret
        `unknown_user` — nästa claim provas inte som andra chans, eftersom
        den kan komma från `otherMails` som användaren själv kan sätta (nOAuth).


        Vid lyckad inloggning sätts refresh-cookien; SPA:n hämtar sedan sin
        access-token via `POST /auth/refresh`.


        Rate limit: 20 anrop/15 min/IP — även 429 svaras som redirect
        (`/login?sso_error=failed`), eftersom svaret renderas i webbläsaren.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code från IdP:n
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: Måste matcha `state` i `oidcTx`-cookien
          schema: { type: string }
      responses:
        "302":
          description: >
            `/login?sso=1` vid lyckad inloggning (refresh-cookie satt),
            `/login?sso_error=unknown_user` när identiteten saknar konto i
            IT-Ticket, och `/login?sso_error=failed` vid övriga fel (saknad
            eller utgången transaktions-cookie, state/nonce/PKCE-fel,
            rate limit, IdP-fel).
          headers:
            Location:
              description: Alltid en intern path — aldrig en URL från requesten
              schema: { type: string }
            Set-Cookie:
              description: HttpOnly `refreshToken` sätts vid lyckad inloggning
              schema: { type: string }
        "503":
          description: SSO är inte konfigurerat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets:
    get:
      tags: [Tickets]
      summary: Lista ärenden
      description: >
        Utan `page`/`limit` returneras en ren array (max 1000, senaste först,
        utan `description`/`notes`/`solution`). Med `page` eller `limit`
        returneras `{ data, pagination }`. `countOnly=true` returnerar bara
        `{ count }` för de aktuella filtren.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, enum: [10, 20, 25, 30, 50, 100, 1000] }, description: "Andra värden faller tillbaka på 10." }
        - { name: status, in: query, schema: { type: string }, description: "En eller flera statusar, kommaseparerade (open, in-progress, waiting, resolved, closed)." }
        - { name: priority, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: Kategori-id. }
        - { name: company_id, in: query, schema: { type: string } }
        - { name: assigned_to, in: query, schema: { type: string } }
        - { name: requester_id, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: Fulltextsökning (FTS5) }
        - { name: tags, in: query, schema: { type: string }, description: Kommaseparerade tagg-id. }
        - { name: tagMode, in: query, schema: { type: string, enum: [any, all] } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: dateField, in: query, schema: { type: string } }
        - { name: checklist, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer, minimum: 0, maximum: 11 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, status, priority, category], default: createdAt } }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: countOnly, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Array (utan paginering), sidindelat svar eller `{ count }`
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/TicketListItem" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TicketListItem" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
                  - type: object
                    properties:
                      count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Tickets]
      summary: Skapa ärende
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Skapat ärende
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }

  /tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Tickets]
      summary: Hämta ärende
      responses:
        "200":
          description: Ärendet (med kommentarer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Tickets]
      summary: Uppdatera ärende
      description: >
        Skrivregel: admin, tilldelad, skapare eller otilldelat ärende (annars `403`).
        `ticket.updated`-webhooken skickas bara när statusen ändras och bär en
        minimal payload (`id`, `status`, `priority`, `assigned_to`, `title`,
        `updated_fields`).
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "200":
          description: Uppdaterat ärende
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tickets]
      summary: Radera ärende (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories:
    get:
      tags: [Categories]
      summary: Lista kategorier
      responses:
        "200":
          description: Kategorier
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      tags: [Categories]
      summary: Skapa kategori (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "201":
          description: Skapad kategori
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Categories]
      summary: Uppdatera kategori (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
