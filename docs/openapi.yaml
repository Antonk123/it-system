openapi: 3.0.3
info:
  title: IT-Ticket API
  version: 1.0.0
  description: >
    REST-API för IT-Ticket — ett ärendehanteringssystem för IT-konsulter.


    **Leverans:** rullande från `main` (en instans per deployment).
    Versionen ovan spårar API-kontraktet, inte appens git-tagg.


    ## API coverage

    This spec documents the full API surface: 137 operations
    across every route file — health/CSRF, auth, tickets, categories,
    contacts, companies, billing, time-entries, kb, public, users, API keys,
    settings, comments, attachments, shares, links, checklists, checklist
    templates, templates, template fields, tags, SLA, recurring tickets,
    reports, backup, push notifications, webhooks, and inbound email.


    **Prose reference:** `docs/API.md` — generated from the actual Express
    routers in `server/src/routes/` and kept up to date on route changes. Use
    it as a narrative cross-check alongside this machine-readable spec.


    ## Autentisering

    Två sätt att autentisera, båda via `Authorization`-headern:

    - **Session (JWT):** `Authorization: Bearer <jwt>`. Access-token gäller 15 min;
      en HttpOnly refresh-cookie (path `/api/auth`) förnyar den via
      `POST /api/auth/refresh`. **Muterande anrop (POST/PUT/PATCH/DELETE) kräver
      även CSRF-token** i `x-csrf-token` (hämtas från `GET /api/csrf-token`).
    - **API-nyckel:** `Authorization: Bearer itk_live_...`. Nycklar har scope
      `read`, `read,write` eller — för administrativa endpoints — även `admin`.
      En nyckel utan `admin` får **403** på admin-skyddade endpoints *även om
      nyckelns ägare är administratör*: nyckeln är credentialen och dess scope
      kan bara inskränka åtkomsten, aldrig utöka den. Endast ett anrop som
      själv har `admin`-scope (eller en inloggad admin-session) får skapa en
      nyckel med `admin`. API-nyckel-anrop är **undantagna från CSRF**.


    ## Fel

    Fel returneras som `{ "error": "..." }` med relevant HTTP-status.
