    name: Se LICENSE i repot
    url: https://github.com/Antonk123/it-system
  contact:
    name: IT-Ticket
    url: https://github.com/Antonk123/it-system

servers:
  - url: https://helpdesk.example.com/api
    description: Your own instance's API base URL (placeholder)
  - url: http://localhost:3002/api
    description: Lokal (docker-compose.local)

tags:
  - name: Auth
    description: Inloggning, tokens, lösenord
  - name: System
    description: Hälsa och CSRF
  - name: Tickets
    description: Ärenden
  - name: Categories
    description: Ärendekategorier
  - name: Contacts
    description: Kontakter/beställare
  - name: Companies
    description: Företag/kunder
  - name: Billing
    description: Timpriser och fakturor (admin)
  - name: Time entries
    description: Tidsrapportering per ärende
  - name: Knowledge base
    description: Kunskapsbas-artiklar
  - name: Public
    description: Oautentiserad portal (deflection, publika ärenden)
  - name: Comments
    description: Comments on tickets
  - name: Attachments
    description: File attachments on tickets
  - name: Checklists
    description: Per-ticket checklist items
  - name: Links
    description: Relationships between tickets
  - name: Shares
    description: Public, unauthenticated share links for tickets
  - name: Checklist templates
    description: Reusable checklist item sets applicable to tickets
  - name: Templates
    description: Reusable ticket blueprints, including dynamic form templates
  - name: Template fields
    description: Custom form fields belonging to a dynamic template
  - name: Tags
    description: Ticket labels
  - name: SLA
    description: Response/resolution time policies
  - name: Recurring tickets
    description: Templates that auto-generate tickets on a schedule
  - name: Users
    description: System user accounts (admin)
  - name: API keys
    description: Personal API keys for programmatic access
  - name: Settings
    description: System-wide configuration
  - name: Reports
    description: Aggregate ticket, time, and requester analytics
  - name: Backup
    description: Full database/uploads backup and restore (admin)
  - name: Push notifications
    description: Web Push subscription management
  - name: Webhooks
    description: Outgoing event webhooks (admin)
  - name: Inbound email
    description: Mail-to-ticket (IMAP) ingestion status

# Default: de flesta endpoints accepterar antingen session-JWT eller API-nyckel.
# Publika endpoints sätter `security: []`, muterande lägger till csrfToken för
# sessionsgrenen (se beforehand: (bearerAuth AND csrfToken) OR apiKeyAuth).
security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Hälsokontroll
      security: []
      responses:
        "200":
          description: Tjänsten är uppe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
        "503":
          description: Databasfel
          $ref: "#/components/responses/Error"

  /csrf-token:
    get:
      tags: [System]
      summary: Hämta CSRF-token
      description: Returnerar token som ska skickas i `x-csrf-token` på muterande sessions-anrop.
      security: []
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: Logga in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Inloggad — access-token + refresh-cookie sätts
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  accessToken: { type: string }
                  token: { type: string, description: Alias för accessToken (bakåtkompat) }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Förnya access-token
      description: Använder refresh-cookien (eller `refreshToken` i body).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Ny access-token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  token: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logga ut
      security:
        - bearerAuth: []
          csrfToken: []
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /auth/me:
    get:
      tags: [Auth]
      summary: Aktuell användare
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Användaren
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Byt lösenord
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Begär lösenordsåterställning
      description: Svarar alltid generiskt (anti-enumeration), oavsett om e-posten finns.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Message" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Återställ lösenord med token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }

  /auth/oidc/enabled:
    get:
      operationId: authOidcEnabled
      tags: [Auth]
      summary: Är SSO (OIDC) påslaget?
      description: >
        Publik — SPA:n frågar innan inloggningsvyn ritas om SSO-knappen ska visas.
      security: []
      responses:
        "200":
          description: SSO-status och knapptext
          content:
            application/json:
              schema:
                type: object
                required: [enabled, label, provider]
                properties:
                  enabled:
                    type: boolean
                    description: >
                      Sant först när samtliga OIDC_*-värden är satta och den
                      konfigurerade issuer-URL:en godkänns statiskt (rätt
                      protokoll, inte en känd multitenant-endpoint eller
                      v1.0-värd). Det tenant-lås som jämför den UPPTÄCKTA
                      issuerns tenant-GUID mot den konfigurerade gäller bara
                      när `OIDC_ISSUER_URL` skrevs i GUID-form — skrevs den i
                      domännamnsform (t.ex. `.../foretag.se/v2.0`, som
                      `.env.example` rekommenderar som lika giltig) hoppar den
                      jämförelsen medvetet över, eftersom Entra alltid svarar
                      med GUID-form i issuern och det inte finns något sätt att
                      slå upp domän→GUID utan ett extra nätverksanrop. Det
                      grundläggande låset — att id_tokenets `tid` måste matcha
                      den tenant som den upptäckta issuern faktiskt namnger —
                      gäller ändå, oavsett vilken form som konfigurerades.
                      `enabled` blir också falskt när boot-proben fått svar
                      från discovery men underkänt den upptäckta issuern
                      (platshållarmall eller Microsofts konsument-tenant) —
                      SSO stängs då AV även om env-värdena fortfarande är
                      giltiga, tills konfigurationen rättas och processen
                      startas om.
                  label: { type: string, nullable: true, description: Knapptext från OIDC_BUTTON_LABEL — null när SSO är av }
                  provider:
                    type: string
                    enum: [microsoft]
                    nullable: true
                    description: >
                      Härledd ur den KONFIGURERADE issuerns värdnamn (aldrig ur
                      `OIDC_BUTTON_LABEL`, som är fri operatörstext) —
                      `"microsoft"` när värdnamnet ligger i Entras värdfamilj,
                      annars `null`. Alltid `null` när `enabled` är `false`.

  /auth/oidc/login:
    get:
      operationId: authOidcLogin
      tags: [Auth]
      summary: Starta SSO-inloggning
      description: >
        Browser-navigation (inte fetch/XHR): svarar 302 till IdP:ns
        authorization-endpoint med Authorization Code + PKCE (S256).
        `state`, `nonce` och `code_verifier` läggs i en kortlivad HttpOnly-cookie
        (`oidcTx`, SameSite=Lax, path `/api/auth/oidc`, 10 min) som callbacken
        verifierar mot. Rate limit: 20 anrop/15 min/IP.
      security: []
      responses:
        "302":
          description: Redirect till IdP:ns authorization-endpoint
          headers:
            Location:
              description: IdP:ns authorization-URL
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Transaktions-cookien `oidcTx` (HttpOnly)
              schema: { type: string }
        "503":
          description: >
            SSO är av — antingen okonfigurerat eller avvisat av
            single-tenant-kontrollen (multitenant-endpoint, v1.0-issuer eller
            icke-https; se `.env.example`) — eller så kunde IdP:ns discovery
            inte nås.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oidc/callback:
    get:
      operationId: authOidcCallback
      tags: [Auth]
      summary: Ta emot IdP:ns svar och logga in
      description: >
        Anropas av webbläsaren via IdP:ns redirect — inte av SPA:n. Kräver
        `oidcTx`-cookien från `/auth/oidc/login`: `state`, `nonce` och PKCE
        verifieras mot den, liksom id_tokenets `aud`, `exp`/`nbf` och `iss`.
        JWS-signaturen valideras **inte** separat mot IdP:ns JWKS — det skulle
        kräva `enableNonRepudiationChecks()` på discovery-configen, vilket koden
        aldrig anropar. Förtroendet vilar i stället på att tokenet hämtas direkt
        från IdP:ns token-endpoint över TLS med confidential-client-
        autentisering, vilket OIDC Core 3.1.3.7 p. 6 uttryckligen tillåter som
        alternativ till signaturverifiering i det här flödet. `iss` (och på
        Entra `tid`) kontrolleras dessutom om av vår egen kod.


        Autentiserar **endast konton som redan finns** i IT-Ticket — ingen
        JIT-provisionering, och en okänd identitet nekas i stället för att
        skapas. Endast den enda konfigurerade tenantens tokens accepteras.


        Identiteten matchas i första hand på paret (`oidc_sub`, `oidc_iss`).
        Ger det ingen träff härleds **exakt en** adress ur claims, och vilken
        claim som ens prövas beror på om den upptäckta issuern är Entra eller
        en generisk OIDC-provider. På Entra, i förtroendeordning:
        `preferred_username` om den innehåller `@` (för en tenant-medlem
        normalt UPN:en, vars suffix Entra kräver ska vara en verifierad domän
        — men `preferred_username` är Microsofts egen dokumenterat ostabila
        claim, så förtroendet gäller bara här, på Entra), annars `email` men
        bara om den är positivt verifierad (`xms_edov: true` eller
        `email_verified: true`), annars avslag. På en generisk OIDC-issuer
        prövas ENDAST `email` med `email_verified: true` —
        `preferred_username` konsulteras aldrig där, eftersom Entras
        UPN-domängaranti inte gäller för en godtycklig IdP. **Ingen fallback i
        något fall:** matchar den valda adressen inget konto blir svaret
        `unknown_user` — nästa claim provas inte som andra chans, eftersom
        den kan komma från `otherMails` som användaren själv kan sätta (nOAuth).


        Vid lyckad inloggning sätts refresh-cookien; SPA:n hämtar sedan sin
        access-token via `POST /auth/refresh`.


        Rate limit: 20 anrop/15 min/IP — även 429 svaras som redirect
        (`/login?sso_error=failed`), eftersom svaret renderas i webbläsaren.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code från IdP:n
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: Måste matcha `state` i `oidcTx`-cookien
          schema: { type: string }
      responses:
        "302":
          description: >
            `/login?sso=1` vid lyckad inloggning (refresh-cookie satt),
            `/login?sso_error=unknown_user` när identiteten saknar konto i
            IT-Ticket, och `/login?sso_error=failed` vid övriga fel (saknad
            eller utgången transaktions-cookie, state/nonce/PKCE-fel,
            rate limit, IdP-fel).
          headers:
            Location:
              description: Alltid en intern path — aldrig en URL från requesten
              schema: { type: string }
            Set-Cookie:
              description: HttpOnly `refreshToken` sätts vid lyckad inloggning
              schema: { type: string }
        "503":
          description: SSO är inte konfigurerat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets:
    get:
      tags: [Tickets]
      summary: Lista ärenden
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, in-progress, waiting, resolved, closed] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: search, in: query, schema: { type: string }, description: Fulltextsökning (FTS5) }
        - { name: company_id, in: query, schema: { type: string } }
        - { name: assigned_to, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Lista med ärenden
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ticket" }
    post:
      tags: [Tickets]
      summary: Skapa ärende
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Skapat ärende
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }

  /tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Tickets]
      summary: Hämta ärende
      responses:
        "200":
          description: Ärendet (med kommentarer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Tickets]
      summary: Uppdatera ärende
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "200":
          description: Uppdaterat ärende
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tickets]
      summary: Radera ärende
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories:
    get:
      tags: [Categories]
      summary: Lista kategorier
      responses:
        "200":
          description: Kategorier
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      tags: [Categories]
      summary: Skapa kategori (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "201":
          description: Skapad kategori
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Categories]
      summary: Uppdatera kategori (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "200":
          description: Uppdaterad kategori
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Categories]
      summary: Radera kategori (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts:
    get:
      tags: [Contacts]
      summary: Lista kontakter
      responses:
        "200":
          description: Kontakter (max 500)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
    post:
      tags: [Contacts]
      summary: Skapa kontakt (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Skapad kontakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }

  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Contacts]
      summary: Hämta kontakt
      responses:
        "200":
          description: Kontakten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Contacts]
      summary: Uppdatera kontakt (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: Uppdaterad kontakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Contacts]
      summary: Radera kontakt (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies:
    get:
      tags: [Companies]
      summary: Lista företag
      responses:
        "200":
          description: Företag med statistik
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }
    post:
      tags: [Companies]
      summary: Skapa företag (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "201":
          description: Skapat företag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }

  /companies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Companies]
      summary: Hämta företag (med kontakter + stats)
      responses:
        "200":
          description: Företaget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Companies]
      summary: Uppdatera företag (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "200":
          description: Uppdaterat företag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Companies]
      summary: Radera företag (admin)
      security:
        - bearerAuth: []
          csrfToken: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /billing/rates/{companyId}:
