          description: Missing/empty `name`, or a tag with that name already exists
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: tagsDelete
      tags: [Tags]
      summary: Delete a knowledge-base tag
      description: Deletes a knowledge-base tag by id. Admin-only.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "409":
          description: Taggen finns i sparad ärende- eller mallhistorik och kan inte tas bort.
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/summary:
    get:
      operationId: reportsSummary
      tags: [Reports]
      summary: Ticket KPI summary
      description: >
        Aggregate ticket counts (totals by status, by category, by priority),
        a 12-month created/closed trend, average resolution time, and the count
        of open tickets aging past 7 days. Available to any authenticated user
        (no admin requirement) — reports are not role-restricted.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: year
          in: query
          description: >
            Filters by `tickets.created_at`. Either the literal `all` (no filter,
            default) or a 4-digit calendar year (2000-2100), matched as a
            `[year-01-01, year+1-01-01)` UTC-naive range against the stored
            ISO timestamp — not a strftime comparison.
          schema: { type: string, example: "2026" }
        - name: month
          in: query
          description: >
            Either the literal `all` (no filter, default) or a 0-based month
            index (0=January .. 11=December, matching JS `Date#getMonth()`).
            Internally converted to 1-based and compared via
            `strftime('%m', created_at)`. Independent of `year` — passing only
            `month` filters across all years.
          schema: { type: string, example: "0" }
      responses:
        "200":
          description: Aggregated summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportsSummary" }
        "400":
          description: Invalid `year` (not 2000-2100) or `month` (not 0-11)
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /reports/requester-analytics:
    get:
      operationId: reportsRequesterAnalytics
      tags: [Reports]
      summary: Per-requester ticket analytics
      description: >
        Per-requester metrics (status/priority breakdown, completion rate,
        average resolution time, aging count, ticket velocity, top 3
        categories and tags) for the top 15 requesters by ticket count. Any
        authenticated user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: year
          in: query
          description: >
            Same `all` / 4-digit-year range-filter semantics as
            `/reports/summary`, applied to `tickets.created_at`.
          schema: { type: string, example: "2026" }
        - name: month
          in: query
          description: Same 0-based-month semantics as `/reports/summary`.
          schema: { type: string, example: "0" }
      responses:
        "200":
          description: Requester analytics array (up to 15 rows)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportsRequesterAnalyticsRow" }
        "400":
          description: Invalid `year` (not 2000-2100) or `month` (not 0-11)
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /reports/status-flow:
    get:
      operationId: reportsStatusFlow
      tags: [Reports]
      summary: 12-month ticket status flow
      description: >
        For each of the last 12 calendar months (by `created_at`), counts
        tickets by their CURRENT status (not the status they had that month).
        No query parameters — always the trailing 12-month window ending
        with the current month. Any authenticated user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: One row per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    month: { type: string, example: "2026-01", description: "YYYY-MM" }
                    open: { type: integer }
                    in-progress: { type: integer }
                    waiting: { type: integer }
                    resolved: { type: integer }
                    closed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /reports/kpi-tickets:
    get:
      operationId: reportsKpiTickets
      tags: [Reports]
      summary: KPI drill-down ticket rows
      description: >
        Server-side drill-down rows backing the Reports page KPI detail
        modals — the raw ticket row shape (snake_case) plus a `tags[]` array,
        capped at 200 rows. `scope=aging` is always unfiltered by year/month
        (mirrors `/reports/summary`'s `agingTickets`: open tickets older than
        7 days); `scope=total` applies the year/month filter. Any
        authenticated user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          description: Which KPI drill-down to return.
          schema: { type: string, enum: [total, aging] }
        - name: year
          in: query
          description: >
            Ignored when `scope=aging`. Same `all` / 4-digit-year
            range-filter semantics as `/reports/summary` otherwise.
          schema: { type: string, example: "2026" }
        - name: month
          in: query
          description: Ignored when `scope=aging`. Same 0-based-month semantics as `/reports/summary` otherwise.
          schema: { type: string, example: "0" }
      responses:
        "200":
          description: Up to 200 ticket rows (snake_case columns) with tags[]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Raw ticket row (snake_case) plus tags[]
        "400":
          description: Missing/invalid `scope`, or invalid `year`/`month`
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /backup:
    get:
      operationId: backupDownload
      tags: [Backup]
      summary: Download a full database backup
      description: >
        Streams a ZIP archive containing the entire SQLite database
        (`data/database.sqlite`, via `db.backup()`) and the full uploads
        directory (`data/uploads/`). **Admin only.** The archive contains
        every secret stored in the database (password hashes, API key
        hashes, webhook HMAC secrets, OAuth tokens, etc.) — treat the
        downloaded file as highly sensitive. Rate-limited to 10 downloads
        per 15 minutes per IP.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: ZIP archive stream
          headers:
            Content-Disposition:
              description: 'attachment; filename="it-ticket-backup-YYYY-MM-DD.zip"'
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Rate limit exceeded (10 downloads / 15 min / IP)
          $ref: "#/components/responses/Error"
        "500": { $ref: "#/components/responses/Error" }

  /backup/restore:
    post:
      operationId: backupRestore
      tags: [Backup]
      summary: Restore the database from an uploaded backup ZIP
      description: >
        **The single most destructive endpoint in this API. Admin only**
        (`authenticate` + `requireAdmin`). Uploads a backup ZIP (max 500 MB; 413 if larger,
        `multipart/form-data`, field name `file`) produced by `GET /backup`,
        validates every ZIP entry (path-traversal / zip-slip rejection,
        allowlist restricted to exactly `data/database.sqlite` and
        `data/uploads/*`, SQLite magic-header check, and a check that the
        `tickets` and `users` tables exist), then **irrecoverably replaces
        the live database and the entire uploads directory with the
        uploaded content**. Before the swap, a WAL-safe snapshot of the current
        database (`database.sqlite.pre-restore`) is taken and the current uploads
        directory is renamed to `uploads.pre-restore`; any failure rolls both
        back. The uploads copy is deleted after the next successful start-up; the
        database copy is kept as a last safety net until the next restore
        overwrites it. The uploaded database must also pass `PRAGMA quick_check`. On success the process calls `process.exit(0)` ~1.5s
        after responding so the container restarts and picks up the new
        database (the response body sets `restartRequired: true`); on
        certain failure paths after the DB handle has already been closed,
        the process instead exits with code 1 to force a clean restart.
        Rate-limited to 5 attempts per 15 minutes per IP.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup ZIP as produced by `GET /backup`.
      responses:
        "200":
          description: Restore accepted; process will restart shortly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  restartRequired: { type: boolean }
        "400":
          description: >
            No file uploaded, non-ZIP file, zip-slip/unexpected-entry
            detected, missing `data/database.sqlite`, invalid SQLite magic
            header, or missing `tickets`/`users` tables in the uploaded DB.
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Rate limit exceeded (5 attempts / 15 min / IP)
          $ref: "#/components/responses/Error"
        "500":
          description: Restore failed (e.g. mid-swap I/O error); rolled back where possible
          $ref: "#/components/responses/Error"

  /backup/config:
    get:
      operationId: backupGetConfig
      tags: [Backup]
      summary: Get the scheduled-backup configuration
      description: Admin only.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Current backup schedule config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfigResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: backupUpdateConfig
      tags: [Backup]
      summary: Update the scheduled-backup configuration
      description: >
        Admin only. Reconfigures the in-process backup scheduler
        immediately (no restart required).
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, time, retentionDays]
              properties:
                enabled: { type: boolean }
                time:
                  type: string
                  description: 24h local time, `HH:MM` (00:00-23:59).
                  example: "02:00"
                retentionDays:
                  type: integer
                  minimum: 1
                  maximum: 3650
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfigResponse" }
        "400":
          description: Invalid `enabled`/`time`/`retentionDays`
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backup/run-now:
    post:
      operationId: backupRunNow
      tags: [Backup]
      summary: Trigger a backup immediately
      description: >
        Admin only. Runs the same backup job the scheduler would run
        (database + uploads snapshot to the configured backup location);
        does not stream a file back — use `GET /backup` to download.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Backup completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success, offsite_failed] }
                  lastRunAt: { type: string, format: date-time, nullable: true }
                  lastSizeBytes: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A backup is already running
          $ref: "#/components/responses/Error"
        "500":
          description: Backup failed
          $ref: "#/components/responses/Error"

  /push/vapid-public-key:
    get:
      operationId: pushGetVapidPublicKey
      tags: [Push notifications]
      summary: Get the VAPID public key
      description: >
        Returns the server's VAPID public key so the client can create a
        Web Push subscription. Any authenticated user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  vapidPublicKey: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Push notifications not configured (no VAPID key set)
          $ref: "#/components/responses/Error"

  /push/subscribe:
    post:
      operationId: pushSubscribe
      tags: [Push notifications]
      summary: Register or update a Web Push subscription
      description: >
        Upserts a push subscription for the authenticated user, keyed on
        `endpoint` — resubscribing the same endpoint updates its keys and
        owning user rather than creating a duplicate row.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  description: Push service endpoint URL from the browser's PushSubscription.
                keys:
                  type: object
                  required: [p256dh, auth]
                  description: The two keys from `PushSubscription.toJSON().keys`.
                  properties:
                    p256dh: { type: string, description: Base64url-encoded P-256 public key. }
                    auth: { type: string, description: Base64url-encoded authentication secret. }
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Missing `endpoint` or `keys.p256dh`/`keys.auth`
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /push/unsubscribe:
    delete:
      operationId: pushUnsubscribe
      tags: [Push notifications]
      summary: Remove a Web Push subscription
      description: >
        Deletes the subscription matching `endpoint`, regardless of which
        user it belonged to (no ownership check — any authenticated user can
        remove any subscription by endpoint). Idempotent: succeeds even if
        no row matched.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200":
          description: Removed (or already absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Missing `endpoint`
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /webhooks:
    get:
      operationId: webhooksList
      tags: [Webhooks]
      summary: List configured outgoing webhooks
      description: Admin only. The `secret` (HMAC signing key) is never returned.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Webhooks (without secret)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhooksWebhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: webhooksCreate
      tags: [Webhooks]
      summary: Create an outgoing webhook
      description: >
        Admin only. `url` is validated against SSRF (see
        `lib/webhookValidator.ts`; blocks e.g. internal/loopback targets) and
        re-validated at delivery time to defend against DNS-rebinding.
        `events` must be a non-empty subset of the fixed event list. A
        32-byte random hex `secret` is generated and stored in **readable
        (not hashed) form** — by design, since it is an HMAC signing key that
        both this server and the receiving endpoint need in raw form to
        compute/verify signatures (the same pattern used by GitHub and
        Stripe), not a password. The `secret` is returned **only in this
        create response** — subsequent `GET`/`PUT` responses omit it.


        **Delivery &amp; signature verification** (not itself an HTTP
        endpoint on this API — this is what the *receiving* server, at
        `url`, must implement). On each matching event this server POSTs a JSON
        body `{ "event": "...", "payload": { ... }, "timestamp": "<ISO>" }` with
        these headers:

        - `X-Webhook-Id` - delivery UUID, **stable across retries** (dedupe on it).
        - `X-Webhook-Timestamp` - unix seconds, set **per attempt**.
        - `X-Webhook-Event` - the event type string.
        - `X-Webhook-Signature` - `hex(HMAC-SHA256(secret, timestamp + "." + id + "." + rawBody))`.

        To verify: recompute the HMAC over the **raw request bytes** (not a
        re-serialised JSON object), compare in constant time, reject timestamps
        older than ~5 minutes, and ignore ids you have already processed.
        **Breaking change:** the previous scheme signed only the body; that
        signature no longer verifies.


        Redirects are never followed - a 3xx response is a final failure (no
        retry). Other non-2xx responses and network/DNS-safety failures retry up
        to 5 attempts in total with back-off of 1m, 5m, 30m and 2h between attempts, then stop.
        `ticket.updated` is only emitted when the status changes, with the
        minimal payload `{ id, status, priority, assigned_to, title,
        updated_fields }` (notes and solution text never leave the system).
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - ticket.created
                      - ticket.updated
                      - ticket.closed
                      - ticket.deleted
                      - ticket.status_changed
                      - comment.created
                      - contact.created
                      - contact.updated
      responses:
        "201":
          description: Created webhook, including the one-time-visible secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhooksWebhookWithSecret" }
        "400":
          description: Missing/unsafe `url`, or missing/invalid `events`
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Error" }

  /webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: webhooksUpdate
      tags: [Webhooks]
      summary: Update a webhook (partial)
      description: >
        Admin only. Any of `url`, `events`, `active` may be omitted to leave
        unchanged; a new `url` is SSRF-validated the same way as creation.
        The secret cannot be changed or re-viewed through this endpoint.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Updated webhook (without secret)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhooksWebhook" }
        "400":
          description: Unsafe `url`
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: webhooksDelete
      tags: [Webhooks]
      summary: Delete a webhook
      description: Admin only.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Error" }

  /webhooks/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: webhooksListDeliveries
      tags: [Webhooks]
      summary: List recent delivery attempts for a webhook
      description: >
        Admin only. Returns the last 50 delivery attempts (most recent
        first), including HTTP response code, attempt count, and last error.
        There is no dedicated test/redelivery endpoint — deliveries are
        created only as a side effect of the triggering domain events
        (ticket/contact changes) via the async dispatcher, not on
        demand through this router.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Delivery attempts (up to 50)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhooksDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Error" }

  /email-inbound/status:
    get:
      operationId: emailInboundStatus
      tags: [Inbound email]
      summary: Get mail-to-ticket (IMAP) configuration status
      description: >
        Reports whether IMAP mail-to-ticket ingestion is configured and
        currently polling, plus the configured host/user/poll-interval/
        auto-create-contact flag. Any authenticated user. Note: actual
        message ingestion happens out-of-band via periodic IMAP polling
        (`lib/emailInbound.ts`), not through any HTTP endpoint — this router
        exposes only this one read-only status check.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  active: { type: boolean, description: Whether the polling timer is currently running. }
                  host: { type: string, nullable: true }
                  user: { type: string, nullable: true }
                  polling_interval: { type: integer, description: Seconds between IMAP polls. }
                  auto_create_contact: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }
  # ───────────────────────── Tickets: aggregates, bulk, import/export ─────────────────────────
  /tickets/import/preview:
    post:
      operationId: ticketsImportPreview
      tags: [Tickets]
      summary: Validate a CSV before importing tickets
      description: >
        Admin only. Parses an uploaded CSV (`multipart/form-data`, field `file`,
        max 10 MB, `.csv` only) and validates every row without writing
        anything. Use `POST /tickets/import/confirm` with the valid rows.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Per-row validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets/import/confirm:
    post:
      operationId: ticketsImportConfirm
      tags: [Tickets]
      summary: Import validated tickets
      description: >
        Admin only. All-or-nothing: every row is validated first (same rules as
        `POST /tickets`), then inserted in one transaction. New ids are always
        generated. Requesters are matched by name or e-mail; a missing contact is
        created when both name and e-mail are given. Writes a `ticket_import`
        audit row.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tickets]
              properties:
                tickets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
                      status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
                      priority: { type: string, enum: [low, medium, high, critical] }
                      category: { type: string, description: Category label (case-insensitive). }
                      requester_name: { type: string }
                      requester_email: { type: string }
                      notes: { type: string }
                      solution: { type: string }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400":
          description: Validation failure or rolled-back transaction (nothing was imported)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets/export:
    get:
      operationId: ticketsExport
      tags: [Tickets]
      summary: Export tickets as XLSX
      description: >
        Any authenticated user. Accepts the same filters as `GET /tickets`
        (status, priority, category, company_id, assigned_to, requester_id,
        search, tags, tagMode, dateFrom, dateTo, dateField, checklist, year,
        month). Default 10 000 rows, max 50 000 (`limit`, `offset`).
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated statuses." }
        - { name: priority, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer, minimum: 0, maximum: 11 } }
        - { name: source, in: query, schema: { type: string, enum: [rapport] }, description: "`rapport` changes the file name prefix." }
        - { name: limit, in: query, schema: { type: integer, default: 10000, maximum: 50000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: XLSX workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/export-archive:
    get:
      operationId: ticketsExportArchive
      tags: [Tickets]
      summary: Export closed tickets as a compact XLSX
      description: >
        Six columns (ID, title, priority, category, tags, closed). Either pass
        `ids` (comma-separated) or the usual ticket filters; without `ids` only
        `closed` tickets are exported (max 5 000).
      parameters:
        - { name: ids, in: query, schema: { type: string }, description: Comma-separated ticket ids. }
      responses:
        "200":
          description: XLSX workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/dashboard-overview:
    get:
      operationId: ticketsDashboardOverview
      tags: [Tickets]
      summary: Dashboard aggregates
      description: The six oldest open tickets by days since last activity, today's created/resolved/closed counts, and the number of non-closed critical tickets.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  agingTickets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        priority: { type: string }
                        status: { type: string }
                        requester_name: { type: string, nullable: true }
                        company_name: { type: string, nullable: true }
                        age_days: { type: integer }
                  todayCounts:
                    type: object
                    properties:
                      created_today: { type: integer }
                      resolved_today: { type: integer }
                      closed_today: { type: integer }
                  criticalCount: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/activity-feed:
    get:
      operationId: ticketsActivityFeed
      tags: [Tickets]
      summary: Recent ticket history events
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 15, maximum: 50 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/TicketHistoryEvent"
                    - type: object
                      properties:
                        ticket_title: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/status-counts:
    get:
      operationId: ticketsStatusCounts
      tags: [Tickets]
      summary: Ticket count per status
      responses:
        "200":
          description: Counts keyed by status (all five keys always present)
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer }
                  in-progress: { type: integer }
                  waiting: { type: integer }
                  resolved: { type: integer }
                  closed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/requester-open-counts:
    get:
      operationId: ticketsRequesterOpenCounts
      tags: [Tickets]
      summary: Non-closed ticket count per requester
      responses:
        "200":
          description: Map of contact id to number of non-closed tickets
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/upcoming-reminders:
    get:
      operationId: ticketsUpcomingReminders
      tags: [Tickets]
      summary: Next unsent reminders across all tickets
      description: Up to six reminders that are still in the future, nearest first.
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    ticket_id: { type: string }
                    reminder_time: { type: string, format: date-time }
                    message: { type: string, nullable: true }
                    ticket_title: { type: string }
                    ticket_status: { type: string }
                    ticket_priority: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/bulk:
    put:
      operationId: ticketsBulkUpdate
      tags: [Tickets]
      summary: Update status, priority, category or assignee on many tickets
      description: >
        Max 500 ids. Same validation as `PUT /tickets/{id}`. The write rule is
        applied per ticket (admin, assignee, creator, or unassigned); tickets
        the caller may not change are returned in `skipped` instead of failing
        the batch. History rows are written per changed field and
        `ticket.status_changed` webhooks are dispatched.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, updates]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
                updates:
                  type: object
                  minProperties: 1
                  properties:
                    status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
                    priority: { type: string, enum: [low, medium, high, critical] }
                    category_id: { type: string, nullable: true }
                    assigned_to: { type: string, nullable: true }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  skipped:
                    type: array
                    description: Ids the caller may not change.
                    items: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets/bulk-delete:
    post:
      operationId: ticketsBulkDelete
      tags: [Tickets]
      summary: Permanently delete many tickets
      description: >
        Admin only. Max 500 ids. Attachment files are removed after commit,
        `ticket.deleted` webhooks are dispatched and one `ticket_bulk_delete`
        audit row is written.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
                  alreadyGone: { type: integer, description: Present when fewer rows were deleted than requested. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: ticketsHistory
      tags: [Tickets]
      summary: Field-change history of a ticket
      description: Oldest first, max 500 rows.
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketHistoryEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/reminders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: ticketsListReminders
      tags: [Tickets]
      summary: List reminders on a ticket
      description: Readable by every authenticated user.
      responses:
        "200":
          description: Reminders, soonest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketReminder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: ticketsCreateReminder
      tags: [Tickets]
      summary: Create a personal reminder on a ticket
      description: >
        Requires write access to the ticket (admin, assignee, creator, or the
        ticket is unassigned). `reminder_time` must be in the future. When due,
        the reminder goes to its creator by e-mail (if SMTP is configured) and
        by Web Push to that user's devices only; failed sends are retried up to
        5 times.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reminder_time]
              properties:
                reminder_time: { type: string, format: date-time }
                message: { type: string, maxLength: 500, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketReminder" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/reminders/sent:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: ticketsClearSentReminders
      tags: [Tickets]
      summary: Delete the caller's already-sent reminders on a ticket
      description: Requires write access to the ticket. Only reminders owned by the caller are removed.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Number removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/reminders/{reminderId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: reminderId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: ticketsDeleteReminder
      tags: [Tickets]
      summary: Cancel a reminder
      description: Only the reminder's owner or an admin may delete it.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── Knowledge base: categories, links, shares, images ─────────────────────────
  /kb/categories:
    get:
      operationId: kbListCategories
      tags: [Knowledge base]
      summary: List KB categories
      description: Any authenticated user. `article_count` counts published articles only.
      responses:
        "200":
          description: Categories ordered by position then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KbCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: kbCreateCategory
      tags: [Knowledge base]
      summary: Create a KB category (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbCategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbCategory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /kb/categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: kbUpdateCategory
      tags: [Knowledge base]
      summary: Update a KB category (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbCategory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: kbDeleteCategory
      tags: [Knowledge base]
      summary: Delete a KB category (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/articles/{id}/tickets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: kbArticleTickets
      tags: [Knowledge base]
      summary: Tickets that link to an article
      responses:
        "200":
          description: Linked tickets, newest link first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    status: { type: string }
                    priority: { type: string }
                    created_at: { type: string, format: date-time }
                    updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /kb/articles/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: kbMarkReviewed
      tags: [Knowledge base]
      summary: Mark an article as reviewed (admin)
      description: Sets `last_reviewed_at` to now (clears the "stale" flag).
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200":
          description: New review timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_reviewed_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/articles/{id}/links:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: kbListArticleLinks
      tags: [Knowledge base]
      summary: Cross-referenced articles (both directions)
      description: Only published articles are returned.
      responses:
        "200":
          description: Related articles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    article_type: { type: string, nullable: true }
                    link_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: kbCreateArticleLink
      tags: [Knowledge base]
      summary: Link two articles (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetArticleId]
              properties:
                targetArticleId: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  source_article_id: { type: string }
                  target_article_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A link between the two articles already exists (either direction)
          $ref: "#/components/responses/Error"

  /kb/articles/{id}/links/{targetId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: targetId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: kbDeleteArticleLink
      tags: [Knowledge base]
      summary: Remove a link between two articles (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/articles/{id}/share:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: kbGetArticleShare
      tags: [Knowledge base]
      summary: Get the active share token of an article (admin)
      description: "`share_token` is `null` when there is no active (non-expired) share."
      responses:
        "200":
          description: Token or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_token: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: kbCreateArticleShare
      tags: [Knowledge base]
      summary: Create a public share link for a published article (admin)
      description: >
        Idempotent: an existing active share is returned with `200`. An expired
        share is replaced. The link is served by `GET /kb/public/{token}`.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Omit for a link that does not expire.
      responses:
        "200":
          description: Existing active share
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_token: { type: string }
        "201":
          description: New share
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Draft articles cannot be shared
          $ref: "#/components/responses/Error"
    delete:
      operationId: kbDeleteArticleShare
      tags: [Knowledge base]
      summary: Revoke an article's share link (admin)
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/ticket/{ticketId}:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: string } }
    get:
      operationId: kbListTicketArticles
      tags: [Knowledge base]
      summary: Articles linked to a ticket
      description: Draft articles are only returned to admins.
      responses:
        "200":
          description: Linked articles with `link_id`
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    content: { type: string }
                    category_id: { type: string, nullable: true }
                    category_name: { type: string, nullable: true }
                    category_color: { type: string, nullable: true }
                    link_id: { type: string }
                    created_at: { type: string, format: date-time }
                    updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: kbLinkArticleToTicket
      tags: [Knowledge base]
      summary: Link a KB article to a ticket
      description: Requires write access to the ticket. Non-admins can only link published articles.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [articleId]
              properties:
                articleId: { type: string }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  ticket_id: { type: string }
                  article_id: { type: string }
                  created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already linked
          $ref: "#/components/responses/Error"

  /kb/ticket/{ticketId}/{articleId}:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: string } }
      - { name: articleId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: kbUnlinkArticleFromTicket
      tags: [Knowledge base]
      summary: Remove a ticket-article link
      description: Requires write access to the ticket.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/upload-image:
    post:
      operationId: kbUploadImage
      tags: [Knowledge base]
      summary: Upload an image for an article (admin)
      description: >
        `multipart/form-data`, field `image`. JPEG, PNG, GIF or WebP only; the
        file's magic bytes must match the declared type. SVG is rejected.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: /api/kb/images/kb-1a2b3c.png }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /kb/images/{filename}:
    parameters:
      - { name: filename, in: path, required: true, schema: { type: string } }
    get:
      operationId: kbGetImage
      tags: [Knowledge base]
      summary: Serve an uploaded KB image
      description: Public (images appear in publicly shared articles). Only files with the `kb-` prefix are served.
      security: []
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── Contacts import/export ─────────────────────────
  /contacts/export:
    get:
      operationId: contactsExport
      tags: [Contacts]
      summary: Export all contacts as XLSX
      description: Any authenticated user. Returns `404` when there are no contacts.
      responses:
        "200":
          description: XLSX workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/import/preview:
    post:
      operationId: contactsImportPreview
      tags: [Contacts]
      summary: Validate a contacts CSV (admin)
      description: >
        `multipart/form-data`, field `file` (CSV). Validates name, e-mail format
        and duplicates (case-insensitive) without writing anything.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Per-row validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  valid: { type: integer }
                  invalid: { type: integer }
                  duplicates: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        contact:
                          type: object
                          properties:
                            name: { type: string }
                            email: { type: string }
                            phone: { type: string, nullable: true }
                            company: { type: string, nullable: true }
                        valid: { type: boolean }
                        errors:
                          type: array
                          items: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contacts/import/confirm:
    post:
      operationId: contactsImportConfirm
      tags: [Contacts]
      summary: Import validated contacts (admin)
      description: >
        All rows are validated first; any validation error aborts the whole
        import with `400` and `rowErrors`. Unknown company names are created.
        Writes a `contact_import` audit row.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  items:
                    type: object
                    required: [name, email]
                    properties:
                      name: { type: string }
                      email: { type: string, format: email }
                      phone: { type: string, nullable: true }
                      company: { type: string, nullable: true }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  created: { type: integer }
                  failed: { type: integer }
                  errors:
                    type: array
                    items: { type: string }
        "400":
          description: Validation failed; nothing was imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  created: { type: integer, example: 0 }
                  failed: { type: integer }
                  error: { type: string }
                  rowErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors:
                          type: array
                          items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── Categories ─────────────────────────
  /categories/reorder:
    put:
      operationId: categoriesReorder
      tags: [Categories]
      summary: Reorder categories (admin)
      description: The position of each id becomes its index in `ids`.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        "200":
          description: Categories in the new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── Auth: audit log ─────────────────────────
  /auth/audit-log:
    get:
      operationId: authAuditLog
      tags: [Auth]
      summary: Read the audit log (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      description: "`audit_log` row joined with the acting user and, for API-key calls, the key name."
                      properties:
                        id: { type: string }
                        user_id: { type: string, nullable: true }
                        api_key_id: { type: string, nullable: true }
                        action: { type: string }
                        entity_type: { type: string, nullable: true }
                        entity_id: { type: string, nullable: true }
                        details: { type: string, nullable: true }
                        ip_address: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        user_email: { type: string, nullable: true }
                        user_display_name: { type: string, nullable: true }
                        api_key_name: { type: string, nullable: true }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── Backup: stored files ─────────────────────────
  /backup/files:
    get:
      operationId: backupListFiles
      tags: [Backup]
      summary: List stored backup ZIPs (admin)
      description: >
        Lists `backup-YYYY-MM-DD[-HHMM].zip` files in the server's backup
        directory (the scheduled/offsite-source backups), newest first, so an
        admin can fetch an earlier backup without shell access. Returns `[]` when
        the directory does not exist.
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backup/files/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: '^backup-\d{4}-\d{2}-\d{2}(-\d{4})?\.zip$' }
    get:
      operationId: backupDownloadFile
      tags: [Backup]
      summary: Download a stored backup ZIP (admin)
      description: >
        Streams one file from `GET /backup/files`. The name is validated against
        the backup file pattern and resolved inside the backup directory.
        Rate-limited with the same limiter as `GET /backup`; writes a
        `backup_download` audit row. The archive contains every secret in the
        database - treat it as highly sensitive.
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400":
          description: Name does not match the backup file pattern
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Rate limit exceeded
          $ref: "#/components/responses/Error"

  # ───────────────────────── Architecture map ─────────────────────────
  /architecture-map:
    get:
      operationId: architectureMap
      tags: [System]
      summary: Architecture map viewer (admin)
      description: >
        Serves the self-contained HTML architecture map from
        `server/admin_assets/architecture-map/`. Admin only; sent with
        `Cache-Control: private, no-store` and `X-Robots-Tag: noindex`.
        Returns `503` if the asset is missing from the image.
      responses:
        "200":
          description: HTML document
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Error" }

  # ───────────────────────── Public: form data and branding ─────────────────────────
  /public/templates:
    get:
      operationId: publicTemplates
      tags: [Public]
      summary: Ticket templates for the public form
      description: Templates with their custom fields (only the columns the form needs).
      security: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Template"
                    - type: object
                      properties:
                        fields:
                          type: array
                          items: { $ref: "#/components/schemas/TemplateField" }

  /public/categories:
    get:
      operationId: publicCategories
      tags: [Public]
      summary: Categories for the public form
      security: []
      responses:
        "200":
          description: Categories ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    label: { type: string }

  /public/branding:
    get:
      operationId: publicBranding
      tags: [Public]
      summary: Instance branding
      description: "`logoUrl` is `null` when no custom logo is configured; otherwise a cache-busted path to `GET /public/branding/logo`."
      security: []
      responses:
        "200":
          description: Branding info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingInfo" }

  /public/branding/logo:
    get:
      operationId: publicBrandingLogo
      tags: [Public]
      summary: Instance logo bytes
      description: >
        PNG, JPEG or WebP (SVG is not accepted). Served `inline` with
        `X-Content-Type-Options: nosniff` and `Cross-Origin-Resource-Policy:
        cross-origin` so it can render on the login page and public form.
      security: []
      responses:
        "200":
          description: Image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: No logo configured
          $ref: "#/components/responses/Error"

  # ───────────────────────── Settings: branding logo ─────────────────────────
  /settings/branding/logo:
    post:
      operationId: settingsUploadLogo
      tags: [Settings]
      summary: Upload or replace the instance logo (admin)
      description: >
        `multipart/form-data`, field `file`. PNG, JPEG or WebP, max 1 MB; magic
        bytes must match the declared type. Writes a `branding_logo_update`
        audit row.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: New branding info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: settingsDeleteLogo
      tags: [Settings]
      summary: Remove the instance logo (admin)
      description: Idempotent - `204` even when no logo was set. Writes a `branding_logo_delete` audit row.
      security:
        - bearerAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Session-JWT: `Authorization: Bearer <jwt>`."
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "API-nyckel: `Authorization: Bearer itk_live_...` (scope read/write/admin; admin-skyddade endpoints kräver `admin` även när ägaren är administratör). Undantagen från CSRF."
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Krävs på muterande sessions-anrop. Hämtas från `GET /api/csrf-token`.

  responses:
    Error:
      description: Fel
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Message:
      description: OK med meddelande
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Unauthorized:
      description: Ej autentiserad
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Saknar behörighet (t.ex. admin krävs eller fel scope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Hittades inte
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, user] }
        mustChangePassword: { type: boolean, description: "Sätts på konton en admin skapat tills lösenordet byts. Finns i login-svaret." }

    Ticket:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, critical] }
        category_id: { type: string, nullable: true }
        requester_id: { type: string, nullable: true }
        requester_name: { type: string, nullable: true }
        category_label: { type: string, nullable: true }
        company_id: { type: string, nullable: true }
        assigned_to: { type: string, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        solution: { type: string, nullable: true }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }

    TicketInput:
      type: object
      required: [title]
      description: Antingen `description` eller `customFields` krävs.
      properties:
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, critical] }
        category_id: { type: string }
        requester_id: { type: string }
        company_id: { type: string }
        assigned_to: { type: string }
        notes: { type: string }
        solution: { type: string }
        template_id: { type: string }
        customFields:
          type: array
          items:
            type: object
            properties:
              fieldName: { type: string }
              fieldLabel: { type: string }
              fieldValue: { type: string }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        label: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    Contact:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        company_id: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        department: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ContactInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        company_id: { type: string }
        department: { type: string }

    Company:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        org_number: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contact_count: { type: integer }
        open_ticket_count: { type: integer }
        total_ticket_count: { type: integer }

    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        org_number: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }

    KbArticle:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string, description: "Utelämnas när `fields=list`." }
        preview: { type: string, description: "Bara med `fields=list`." }
        category_id: { type: string, nullable: true }
        category_name: { type: string, nullable: true }
        article_type: { type: string, enum: [how-to, solution] }
        status: { type: string, enum: [draft, published] }
        tags:
          type: array
          items: { type: string }
        view_count: { type: integer }
        last_reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KbArticleInput:
      type: object
      required: [title, category_id]
      properties:
        title: { type: string }
        content: { type: string }
        category_id: { type: string }
        article_type: { type: string, enum: [how-to, solution] }
        status: { type: string, enum: [draft, published] }
        tag_ids:
          type: array
          items: { type: string }

    KbPortalTag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }

    KbPortalCategory:
      type: object
      required: [id, name, article_count]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, nullable: true }
        article_count: { type: integer, minimum: 1 }

    KbPortalArticleSummary:
      type: object
      required: [id, title, snippet, category_id, category_name, category_color, article_type, tags, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        category_id: { type: string, nullable: true }
        category_name: { type: string, nullable: true }
        category_color: { type: string, nullable: true }
        article_type: { type: string, enum: [how-to, solution], nullable: true }
        tags:
          type: array
          items: { $ref: "#/components/schemas/KbPortalTag" }
        updated_at: { type: string, format: date-time }

    KbPortalArticle:
      allOf:
        - $ref: "#/components/schemas/KbPortalArticleSummary"
        - type: object
          required: [content]
          properties:
            content: { type: string }

    UserAdminView:
      type: object
      description: Shape returned from `GET /users` when the caller is an admin.
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
        lastSignIn: { type: string, format: date-time, nullable: true }
        emailConfirmed:
          type: boolean
          description: Always `true` — hardcoded in the response, not backed by a real verification flag.
        ssoLinked:
          type: boolean
          description: >
            `true` when the account is linked to an SSO identity (`oidc_sub` is
            set). Only the fact is exposed, never `oidc_sub`/`oidc_iss`: the
            subject identifier is a stable key at the IdP and the issuer reveals
            which tenant the instance trusts. Clear the link with
            `PATCH /users/{id}` and `clearSsoLink: true`.

    UserSummary:
      type: object
      description: Reduced shape returned from `GET /users` for non-admin callers.
      properties:
        id: { type: string }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [admin, user] }

    UserCreateRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          format: password
          description: >
            Optional. If omitted, a random password is generated and returned
            as `temporaryPassword`. If supplied, must satisfy the password
            policy (same as change-password/reset-password).
        role:
          type: string
          description: Any value other than `"admin"` (or omission) becomes `"user"`.
          enum: [admin, user]
        displayName:
          type: string
          nullable: true
          description: 1–100 characters after trim; falls back to a matching contact's name if omitted.

    UserUpdateRequest:
      type: object
      description: >
        At least one property that actually changes something is required —
        `clearSsoLink: false` on its own counts as nothing to update (400).
      properties:
        role: { type: string, enum: [admin, user] }
        displayName:
          type: string
          nullable: true
          description: Empty string or null clears the field. Max 100 characters after trim.
        clearSsoLink:
          type: boolean
          description: >
            `true` unlinks the account's SSO identity: both `oidc_sub` and
            `oidc_iss` are set to NULL **and** every refresh token the user holds
            is revoked, in the same transaction. Needed when an email address
            changes owner — otherwise the new employee is stuck on a conflicting
            link forever, and the previous holder's refresh token would keep
            rotating for up to 7 days. Revoking the refresh token stops future
            access tokens from being minted; an access token already issued is
            a self-contained JWT that is not revoked and stays valid for up to
            15 minutes regardless. `false` is accepted but does nothing. Any
            non-boolean value is rejected with 400. Audit-logged as
            `user_update` with `sso_link: cleared`.

    ApiKey:
      type: object
      description: An API key as returned by list/create, with key material omitted (except the one-time raw value on create).
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix:
          type: string
          description: First 8 hex chars of the raw key, shown for identification.
        permissions:
          type: string
          description: >
            JSON-encoded array of scope strings (e.g. `["read"]` or
            `["read","write"]`), returned verbatim as stored — not parsed
            into a JSON array by the API.
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Required, non-blank after trim." }
        permissions:
          type: array
          items: { type: string }
          description: >
            Optional array of scope strings, e.g. `["read"]` or
            `["read","write"]`. If omitted or not an array, defaults to
            `["read"]` without an error.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional ISO date/time; must be in the future. Defaults to one year from creation if omitted.

    ApiKeyCreated:
      type: object
      description: Response from key creation — the only time the raw key value is ever returned.
      properties:
        id: { type: string }
        name: { type: string }
        key:
          type: string
          description: Raw key value (`itk_live_...`). Shown once; only its SHA-256 hash is stored server-side.
        key_prefix: { type: string }
        permissions:
          type: string
          description: JSON-encoded array of scope strings, as stored (see `ApiKey.permissions`).
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    commentsComment:
      type: object
      description: A comment on a ticket (row from `ticket_comments`, joined with author display info).
      properties:
        id: { type: string }
        ticket_id: { type: string }
        user_id: { type: string }
        content:
          type: string
          description: Sanitized rich-text HTML.
        is_internal:
          type: integer
          description: SQLite boolean (0 or 1) — 0 means the comment is a public reply visible to the customer.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        user_name:
          type: string
          nullable: true
          description: "`display_name`, falling back to the matching contact's name, then the user's email."
        user_email: { type: string, nullable: true, format: email }
      required: [id, ticket_id, user_id, content, is_internal, created_at, updated_at]

    attachmentsAttachment:
      type: object
      description: Metadata row from `ticket_attachments`, plus a computed download `url`.
      properties:
        id: { type: string }
        ticket_id: { type: string }
        file_name:
          type: string
          description: Original uploaded filename.
        file_path:
          type: string
          description: Server-side stored filename (opaque, not the original name).
        file_size: { type: integer, nullable: true, description: Bytes. }
        file_type: { type: string, nullable: true, description: Declared MIME type. }
        created_at: { type: string, format: date-time }
        url:
          type: string
          description: Relative download URL, e.g. `/api/attachments/file/{id}`.
      required: [id, ticket_id, file_name, file_path, created_at, url]

    linksTicketLink:
      type: object
      description: A bidirectional relationship between two tickets, enriched with the "other side"'s summary.
      properties:
        id: { type: string }
        sourceTicketId: { type: string }
        targetTicketId: { type: string }
        linkType: { type: string }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        linkedTicket:
          type: object
          description: Summary of whichever ticket is NOT the one the request was scoped to.
          properties:
            id: { type: string }
            title: { type: string }
            status: { type: string }
            priority: { type: string }
            created_at: { type: string, format: date-time }
          required: [id, title, status, priority, created_at]
      required: [id, sourceTicketId, targetTicketId, linkType, createdAt, linkedTicket]

    sharesPublicTicketView:
      type: object
      description: >
        Public (unauthenticated) view of a shared ticket. Same shape as the
        internal Ticket resource with `notes` (internal agent notes) removed,
        plus the requester's contact record, attachments, checklist items, and
        the share link's expiry time.
      properties:
        ticket:
          allOf:
            - $ref: "#/components/schemas/Ticket"
            - type: object
              description: The `notes` field is always absent here even though it is present on the internal Ticket schema.
              properties:
                category:
                  $ref: "#/components/schemas/Category"
                  nullable: true
        requester:
          allOf:
            - $ref: "#/components/schemas/Contact"
          nullable: true
        attachments:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/attachmentsAttachment"
              - type: object
                properties:
                  url:
                    type: string
                    description: "Public download URL: `/api/shares/public/file/{token}/{attachmentId}` (no auth required)."
        checklistItems:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              completed: { type: boolean }
              position: { type: integer }
            required: [id, label, completed, position]
        share_expires_at:
          type: string
          format: date-time
          description: UTC timestamp when this share link expires and becomes inaccessible
      required: [ticket, attachments, checklistItems, share_expires_at]

    ChecklistItem:
      type: object
      description: A single item on a ticket's checklist. May be nested one level via `parent_id`.
      properties:
        id: { type: string }
        ticket_id: { type: string }
        label: { type: string }
        completed: { type: boolean }
        position: { type: integer }
        parent_id: { type: string, nullable: true }
        due_date: { type: string, nullable: true, description: Free-form date string; no format enforced by the route. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChecklistItemCreateInput:
      type: object
      required: [label]
      properties:
        label: { type: string }
        parent_id: { type: string, nullable: true }
        due_date: { type: string, nullable: true }

    ChecklistItemBulkInput:
      type: object
      description: >
        Provide either `labels` (plain strings) or `items` (strings and/or
        objects). Blank/whitespace-only entries are dropped; if `items` is
        present it takes precedence over `labels`.
      properties:
        labels:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                required: [label]
                properties:
                  label: { type: string }
                  parent_id: { type: string, nullable: true }
                  due_date: { type: string, nullable: true }

    ChecklistItemUpdateInput:
      type: object
      description: All fields optional; only supplied keys are updated.
      properties:
        label: { type: string }
        completed: { type: boolean }
        due_date: { type: string, nullable: true }
        parent_id: { type: string, nullable: true }

    ChecklistProgress:
      type: object
      description: Keyed by ticket id; only ids the caller may access are present.
      additionalProperties:
        type: object
        properties:
          total: { type: integer }
          completed: { type: integer }

    ChecklistTemplate:
      type: object
      description: >
        A reusable, named list of checklist item labels that can be applied
        (copied) onto any ticket's checklist. Distinct from a `Template`
        (ticket template) — this only produces checklist items, not a ticket.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistTemplateItem" }

    ChecklistTemplateItem:
      type: object
      description: One row of a checklist template; nesting is expressed by `parent_label` matching another item's `label` within the same template (not by id).
      properties:
        id: { type: string }
        template_id: { type: string }
        label: { type: string }
        parent_label: { type: string, nullable: true }
        position: { type: integer }

    ChecklistTemplateInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string }
        description: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              parent_label: { type: string }

    ChecklistTemplateUpdateInput:
      type: object
      description: >
        `name`/`description` are only touched if `name` is present. If
        `items` is present, it fully replaces the template's existing items.
      properties:
        name: { type: string }
        description: { type: string }
        items:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              parent_label: { type: string }

    Template:
      type: object
      description: >
        A reusable ticket blueprint used to prefill `POST /tickets`. `standard`
        templates prefill title/description/etc.; `dynamic` templates instead
        carry a set of custom form `fields` used to compose the ticket body.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        template_type: { type: string, enum: [standard, dynamic] }
        title_template: { type: string }
        description_template: { type: string, description: Empty string for dynamic templates rather than null (column is NOT NULL). }
        priority: { type: string, enum: [low, medium, high, critical] }
        category_id: { type: string, nullable: true }
        notes_template: { type: string, nullable: true }
        solution_template: { type: string, nullable: true }
        position: { type: integer }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        fields:
          type: array
          items: { $ref: "#/components/schemas/TemplateField" }

    TemplateInput:
      type: object
      required: [name, title_template]
      properties:
        name: { type: string }
        description: { type: string }
        template_type: { type: string, enum: [standard, dynamic], default: standard }
        title_template: { type: string }
        description_template: { type: string, description: Required unless template_type is dynamic. }
        priority: { type: string, enum: [low, medium, high, critical], default: medium }
        category_id: { type: string, nullable: true }
        notes_template: { type: string, nullable: true }
        solution_template: { type: string, nullable: true }
        fields:
          type: array
          description: Only used when template_type is dynamic; inserted inline for this template.
          items: { $ref: "#/components/schemas/TemplateFieldInput" }

    TemplateUpdateInput:
      type: object
      description: All fields optional; each omitted field keeps its current value. Fields (custom form fields) cannot be set here.
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        template_type: { type: string, enum: [standard, dynamic] }
        title_template: { type: string }
        description_template: { type: string }
        priority: { type: string, enum: [low, medium, high, critical] }
        category_id: { type: string, nullable: true }
        notes_template: { type: string, nullable: true }
        solution_template: { type: string, nullable: true }

    TemplateField:
      type: object
      description: A single custom form field belonging to a dynamic Template.
      properties:
        id: { type: string }
        template_id: { type: string }
        field_name: { type: string }
        field_label: { type: string }
        field_type: { type: string, enum: [text, textarea, number, select, date, checkbox] }
        placeholder: { type: string, nullable: true }
        default_value: { type: string, nullable: true }
        required:
          type: integer
          enum: [0, 1]
          description: >
            SQLite boolean stored/returned as 0 or 1. Unlike ticket-checklist
            items, this route does not map it to a JSON boolean.
        options:
          type: string
          nullable: true
          description: >
            JSON-encoded array of option strings, used when field_type is
            select. Stored/returned as the raw serialized string, not parsed.
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateFieldInput:
      type: object
      required: [field_name, field_label, field_type]
      description: >
        Used for both create (all required fields must be present) and
        update (all fields optional — omitted ones keep their current value).
      properties:
        field_name: { type: string }
        field_label: { type: string }
        field_type: { type: string, enum: [text, textarea, number, select, date, checkbox] }
        placeholder: { type: string, nullable: true }
        default_value: { type: string, nullable: true }
        required:
          type: boolean
          description: Coerced to 0/1 on write.
        options:
          description: >
            Options for a select field. The route re-serializes whatever is
            sent with JSON.stringify before storing it — send a plain array
            of strings here, not a pre-encoded JSON string.
          type: array
          items: { type: string }
        position: { type: integer }

    TagsTag:
      type: object
      description: A knowledge-base tag (label), not an OpenAPI `tags:` grouping.
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, example: "#3b82f6" }
        created_at: { type: string, format: date-time }
      required: [id, name, color, created_at]

    TagsInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed server-side; must be non-empty and unique among tags.
        color:
          type: string
          description: Defaults to `#3b82f6` when omitted or falsy.
          example: "#3b82f6"

    ReportsSummary:
      type: object
      properties:
        totals:
          type: object
          properties:
            open: { type: integer }
            inProgress: { type: integer }
            waiting: { type: integer }
            resolved: { type: integer }
            closed: { type: integer }
            total: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              count: { type: integer }
        byPriority:
          type: array
          items:
            type: object
            properties:
              priority: { type: string, enum: [critical, high, medium, low] }
              count: { type: integer }
        trend:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: "2026-01" }
              created: { type: integer }
              closed: { type: integer }
        avgResolutionDays: { type: number }
        agingTickets:
          type: integer
          description: Open tickets older than 7 days, always unfiltered by year/month.

    ReportsRequesterAnalyticsRow:
      type: object
      properties:
        userId: { type: string, description: "Contact id, or the literal `unassigned`." }
        name: { type: string }
        totalTickets: { type: integer }
        statusBreakdown:
          type: object
          properties:
            open: { type: integer }
            in-progress: { type: integer }
            waiting: { type: integer }
            resolved: { type: integer }
            closed: { type: integer }
        priorityBreakdown:
          type: object
          properties:
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
            critical: { type: integer }
        completionRate: { type: number, description: "Percentage 0-100." }
        avgResolutionTime: { type: number, description: Days. }
        agingTickets: { type: integer }
        lastTicketDate: { type: string, format: date-time }
        ticketVelocity: { type: number, description: Tickets per month since the requester's first ticket. }
        topCategories:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              category: { type: string }
              count: { type: integer }

    BackupConfigResponse:
      type: object
      properties:
        enabled: { type: boolean }
        time: { type: string, example: "02:00", description: "HH:MM, container-local time." }
        retentionDays: { type: integer }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, enum: [success, failed, offsite_failed], nullable: true }
        lastSizeBytes: { type: integer, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true, description: "null when paused (enabled=false)." }
        consecutiveFailures: { type: integer }
        offsiteFailureCount: { type: integer }
        lastError: { type: string, nullable: true, description: Last backup failure message. }

    WebhooksWebhook:
      type: object
      description: Webhook row without the HMAC secret.
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events: { type: string, description: JSON-encoded array of event-type strings. }
        active: { type: integer, enum: [0, 1] }
        created_at: { type: string, format: date-time }
        last_triggered_at: { type: string, format: date-time, nullable: true }

    WebhooksWebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhooksWebhook"
        - type: object
          properties:
            secret:
              type: string
              description: >
                32-byte hex HMAC-SHA256 signing key. Returned only on
                creation — store it now, it cannot be retrieved again.

    WebhooksDelivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event: { type: string }
        payload: { type: string, description: JSON-encoded delivered event payload. }
        response_code: { type: integer, nullable: true, description: "0 if the URL failed re-validation (e.g. DNS-rebind to an internal address) before any request was sent." }
        attempts: { type: integer }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer, description: Only on ticket lists. }
        hasNext: { type: boolean, description: Only on ticket lists. }
        hasPrev: { type: boolean, description: Only on ticket lists. }

    TicketListItem:
      type: object
      description: Ticket as returned by list endpoints - without the heavy `description`, `notes` and `solution` fields.
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, critical] }
        category_id: { type: string, nullable: true }
        category_label: { type: string, nullable: true }
        requester_id: { type: string, nullable: true }
        requester_name: { type: string, nullable: true }
        company_id: { type: string, nullable: true }
        assigned_to: { type: string, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        template_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }

    TicketHistoryEvent:
      type: object
      properties:
        id: { type: string }
        ticket_id: { type: string }
        user_id: { type: string, nullable: true }
        user_name: { type: string, nullable: true }
        field_name: { type: string, description: "`status`, `priority`, `category_id`, `assigned_to`, ..." }
        old_value: { type: string, nullable: true }
        new_value: { type: string, nullable: true }
        changed_at: { type: string, format: date-time }

    TicketReminder:
      type: object
      properties:
        id: { type: string }
        ticket_id: { type: string }
        user_id: { type: string }
        reminder_time: { type: string, format: date-time }
        message: { type: string, nullable: true }
        sent: { type: integer, enum: [0, 1] }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        user_name: { type: string, nullable: true, description: Only on the list endpoint. }
        user_email: { type: string, nullable: true, description: Only on the list endpoint. }

    ImportPreview:
      type: object
      properties:
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        duplicates: { type: integer }
        results:
          type: array
          items:
            type: object
            description: One entry per CSV row, with `valid`, `errors` and the parsed values.
            additionalProperties: true

    ImportResult:
      type: object
      properties:
        success: { type: boolean }
        created: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }
        error: { type: string }
        message: { type: string }

    KbCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, nullable: true }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        article_count: { type: integer, description: Published articles only. Present on the list endpoint. }

    KbCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string, nullable: true }

    BackupFile:
      type: object
      properties:
        name: { type: string, example: backup-2026-10-09-0200.zip }
        sizeBytes: { type: integer }
        modifiedAt: { type: string, format: date-time }

    BrandingInfo:
      type: object
      properties:
        logoUrl: { type: string, nullable: true, example: "/api/public/branding/logo?v=1760000000000" }
