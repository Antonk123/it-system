name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: inget jobb här skriver till repot, öppnar PR:er eller publicerar
# paket. Utan den här raden kör GITHUB_TOKEN med repots default-behörighet, som kan
# vara write — onödig blast radius om en tredjeparts-action blir komprometterad.
permissions:
  contents: read

# Actions är pinnade till commit-SHA i stället för flyttbara taggar (@v7). En tagg
# kan pekas om av den som äger actionen — exakt vägen in i tj-actions/changed-files-
# attacken 2025. En SHA kan inte pekas om.
# Uppdatera med: gh api repos/<ägare>/<action>/commits/<tagg> -q .sha
# Dependabot bumpar dem automatiskt (github_actions-ekosystemet i dependabot.yml).

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd server && npm ci
      - run: npx eslint . --max-warnings 5
      # Root-tsconfig har files:[]+references → 'tsc --noEmit' typecheckar INGET. Kör projekten explicit.
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npm test
      # OpenAPI-specen måste vara strukturellt giltig (docs/openapi.yaml).
      - run: npm run openapi:lint

  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npx tsc --noEmit
      # --coverage verkställer ratchet-trösklarna i vitest.config.ts (fäller
      # bygget om täckningen tappar under dem).
      - run: cd server && npm test -- --coverage

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f Dockerfile.server -t test-backend .
      - run: docker build -f Dockerfile.client -t test-frontend .

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd server && npm ci
      # Fäller bygget på ALLA high/critical-advisories utom de som uttryckligen
      # undantagits i audit-allowlist.json. Varje undantag kräver en motivering för
      # varför advisoryn inte är nåbar i den här appen, plus ett expires-datum som
      # fäller gaten igen när det passeras — undantag ska omprövas, inte glömmas.
      # Ersätter `npm audit --audit-level=high`, som bara kunde vara helt på eller
      # sänkt till critical (och då tystat även framtida high-advisories).
      - run: node scripts/audit-check.mjs .
      - run: node scripts/audit-check.mjs server
