<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/theme-kit/1.2.0/prefabnavet-theme.css" />
    <script src="/theme-kit/1.2.0/prefabnavet-theme-bridge.js"></script>
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         real values in the installed PWA. The layout (mobile header, bottom tab
         bar, action bars) already pads for these insets; without cover they were
         silently 0, so content slid under the iOS notch/status bar and home
         indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png?v=2" type="image/png" />
    <link rel="shortcut icon" href="/favicon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- PWA Manifest is injected by vite-plugin-pwa (/manifest.webmanifest).
         Do NOT add a hand-authored <link rel="manifest"> here: the browser uses
         the FIRST manifest link it sees, and a stale /manifest.json (77x86 icon)
         previously shadowed the real one, breaking Add-to-Home-Screen. -->
    <meta name="theme-color" content="#f6f1e7" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IT-Ticket" />

    <title>IT-Ticket</title>
    <meta name="description" content="Internt ärendehanteringssystem för IT-support" />

    <meta property="og:title" content="IT-Ticket System" />
    <meta property="og:description" content="Internt ärendehanteringssystem för IT-support" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- FOUC prevention: apply the light/dark mode class before React hydrates (D-08) -->
    <script>
      (function() {
        var mode = 'light';
        try {
          var storedMode = localStorage.getItem('app-mode-theme');
          if (storedMode === 'light' || storedMode === 'dark') mode = storedMode;
        } catch (e) {}
        document.documentElement.classList.add(mode);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
